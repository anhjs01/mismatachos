<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Un calendario para Aleja</title>
<meta name="theme-color" content="#07030b">
<meta name="color-scheme" content="dark">
<meta name="description" content="Un rincón de música, mensajes y pequeños detalles para Aleja.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="calendario-urbano.css">
</head>
<body class="calendario-urbano">

  <div class="sky" aria-hidden="true">
    <div class="glow glow--1"></div>
    <div class="glow glow--2"></div>
    <div class="glow glow--3"></div>
    <div id="stars" class="stars"></div>
  </div><main class="calendario-scene">
    <div class="calendario-header">
      <h1 class="titulo-grande calendario-titulo">Un calendario para Aleja</h1>
      <p class="calendario-progreso" id="textoProgreso">Día 1 de 78</p>
      <div class="barra-progreso"><div class="barra-progreso__relleno" id="barraRelleno"></div></div>
    </div>

    <div class="dias-grid" id="diasGrid"></div>

    <p class="calendario-footer">
      <a href="index.html">← Volver al inicio</a>
      &nbsp;·&nbsp;
      <a id="reiniciarLink">Reiniciar progreso</a>
      &nbsp;·&nbsp;
      <a href="juego-musical.html">✦ Jugar con las canciones</a>
    </p>
  </main>

  <!-- Modal del día -->
  <div id="modalOverlay" class="modal-overlay" aria-hidden="true">
    <div class="modal-card" id="modalCard" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <span class="paso-decoracion" id="pasoDecoracion" aria-hidden="true"></span>
      <button type="button" class="modal-close" id="modalClose" aria-label="Cerrar">✕</button>

      <div class="modal-steps" id="modalSteps"></div>

      <span class="modal-icon" id="modalIcon"></span>
      <p class="modal-chip" id="modalChip"></p>
      <h2 class="modal-title" id="modalTitle"></h2>

      <div id="pasoContenido"></div>

      <div class="modal-actions">
        <button type="button" class="btn btn--ghost" id="btnAnterior">← Anterior</button>
        <button type="button" class="btn" id="btnSiguiente">Siguiente →</button>
      </div>
    </div>
  </div>

  <script src="catalogo-canciones.js"></script>
  <script src="reproductor.js"></script>
  <script src="contenido-calendario.js"></script>
  <script src="comun.js"></script>
  <script src="script-calendario.js?v=20261016-1"></script>
</body>
</html>
