 <rect x="48" y="62" width="380" height="360" rx="120" fill="url(#papel)"/>
 <g clip-path="url(#fotoPerro)"><image href="WhatsApp%20Image%202026-10-13%20at%206.58.20%20PM.jpeg" x="58" y="70" width="360" height="390" preserveAspectRatio="xMidYMid slice"/></g>
 <rect x="58" y="78" width="360" height="330" rx="110" fill="none" stroke="#fff8f1" stroke-width="5"/>
</g>
