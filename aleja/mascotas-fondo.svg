 <path d="M28 420 Q65 360 52 300 Q43 260 72 225"/><path d="M1064 425 Q1028 365 1045 308 Q1055 267 1024 224"/>
 <path d="M450 440 Q480 414 475 380"/><path d="M715 435 Q690 405 700 374"/>
</g>
<g fill="#f3c6d7" stroke="#fff0f4" stroke-width="2">
 <g transform="translate(70 230)"><ellipse cy="-13" rx="8" ry="15"/><ellipse cy="-13" rx="8" ry="15" transform="rotate(72)"/><ellipse cy="-13" rx="8" ry="15" transform="rotate(144)"/><ellipse cy="-13" rx="8" ry="15" transform="rotate(216)"/><ellipse cy="-13" rx="8" ry="15" transform="rotate(288)"/><circle r="6" fill="#e9bd69"/></g>
 <g transform="translate(1032 224) scale(.8)"><ellipse cy="-13" rx="8" ry="15"/><ellipse cy="-13" rx="8" ry="15" transform="rotate(72)"/><ellipse cy="-13" rx="8" ry="15" transform="rotate(144)"/><ellipse cy="-13" rx="8" ry="15" transform="rotate(216)"/><ellipse cy="-13" rx="8" ry="15" transform="rotate(288)"/><circle r="6" fill="#e9bd69"/></g>
 <g transform="translate(475 382) scale(.6)"><ellipse cy="-13" rx="8" ry="15"/><ellipse cy="-13" rx="8" ry="15" transform="rotate(72)"/><ellipse cy="-13" rx="8" ry="15" transform="rotate(144)"/><ellipse cy="-13" rx="8" ry="15" transform="rotate(216)"/><ellipse cy="-13" rx="8" ry="15" transform="rotate(288)"/><circle r="6" fill="#e9bd69"/></g>
</g>
