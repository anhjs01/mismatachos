<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 510" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">Las mascotas de Aleja</title>
<desc id="descripcion">Un collage delicado con el perrito blanco y negro y los dos gatitos, rodeados de flores, corazones y pequeños destellos.</desc>
<defs>
  <linearGradient id="papel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff4e8"/><stop offset="1" stop-color="#f6dce5"/></linearGradient>
  <linearGradient id="borde" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff7e9"/><stop offset=".5" stop-color="#e9b3c5"/><stop offset="1" stop-color="#d8b77c"/></linearGradient>
  <filter id="sombra" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#100714" flood-opacity=".32"/></filter>
  <clipPath id="fotoPerro"><rect x="58" y="78" width="360" height="330" rx="110"/></clipPath>
  <clipPath id="fotoGato1"><rect x="468" y="112" width="248" height="280" rx="100"/></clipPath>
  <clipPath id="fotoGato2"><rect x="760" y="78" width="280" height="330" rx="105"/></clipPath>
  <clipPath id="fotoPerro2"><circle cx="385" cy="350" r="75"/></clipPath>
</defs>
<!-- soft paper-like halo -->
<ellipse cx="550" cy="270" rx="510" ry="210" fill="#f8dfe8" opacity=".13"/>
